name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build remapped mod jar
        run: bash ./gradlew --no-daemon remapJar

      - name: Upload mod jar
        uses: actions/upload-artifact@v6
        with:
          name: schematic-builder-${{ github.sha }}
          path: build/libs/schematic-builder-0.1.0.jar
          if-no-files-found: error
